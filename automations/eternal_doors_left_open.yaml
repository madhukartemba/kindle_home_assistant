# One list of Eternal door opening sensors.
# Add a new door in both places below: the automation trigger and the script call.
# Home Assistant runs this from 10:00 PM to 6:00 AM. A door must stay open for 10 minutes.
# The phone notification uses the Door alerts channel. Alexa says the same sentence.

doors: &doors
  - binary_sensor.main_door_eternal_10_opening
  - binary_sensor.eternal_9db8_opening
  - binary_sensor.eternal_0263_opening
  - binary_sensor.eternal_3bf0_opening
  - binary_sensor.eternal_c965_opening
  - binary_sensor.eternal_6a82_opening

script:
  eternal_doors_left_open:
    alias: Eternal doors left open
    description: Pass each Eternal door's opening sensor.
    mode: queued
    fields:
      doors:
        name: Opening sensors
        required: true
        default: *doors
        selector:
          entity:
            multiple: true
            domain: binary_sensor
      open_minutes:
        name: Minutes open
        default: 10
        selector:
          number:
            min: 1
            max: 180
            mode: box
    sequence:
      - condition: time
        after: "22:00:00"
        before: "06:00:00"
      - variables:
          open_names: >
            {% set mins = open_minutes | default(10) | int %}
            {% set ns = namespace(items=[]) %}
            {% for eid in doors | default([]) %}
              {% if is_state(eid, 'on') %}
                {% set age = as_timestamp(now()) - as_timestamp(states[eid].last_changed) %}
                {% if age >= (mins * 60 - 5) %}
                  {% set raw = state_attr(eid, 'friendly_name') or eid %}
                  {% set name = raw | regex_replace('(?i)\s+opening$', '') %}
                  {% set name = name.split(' Eternal')[0] | trim %}
                  {% if 'door' not in name | lower %}
                    {% set name = name ~ ' door' %}
                  {% endif %}
                  {% set shown = (age / 60) | round(0, 'floor') | int %}
                  {% if shown < mins %}{% set shown = mins %}{% endif %}
                  {% set unit = 'minute' if shown == 1 else 'minutes' %}
                  {% set ns.items = ns.items + [name ~ ' has been open for ' ~ shown ~ ' ' ~ unit] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.items }}
      - condition: template
        value_template: "{{ open_names | length > 0 }}"
      - action: notify.notify
        data:
          title: Door left open
          message: "{{ open_names | join('. ') }}."
          data:
            channel: Door alerts
            importance: high
            priority: high
            tag: eternal-door-open
      - action: notify.alexa_media
        data:
          target:
            - media_player.echo_1
            - media_player.echo_2
            - media_player.echo_3
            - media_player.echo_dot
          message: "{{ open_names | join('. ') }}."
          data:
            type: tts

automation:
  - alias: Doors left open after 10pm
    description: Add each new Eternal door's opening sensor to the trigger list and to the doors list.
    mode: queued
    triggers:
      - trigger: state
        entity_id: *doors
        to: "on"
        for:
          minutes: 10
      - trigger: time
        at: "22:10:00"
    conditions:
      - condition: time
        after: "22:00:00"
        before: "06:00:00"
    actions:
      - action: script.eternal_doors_left_open
        data:
          open_minutes: 10
          doors: *doors
